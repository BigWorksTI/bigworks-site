# Deploy:
#   docker compose -p bigworks-site up -d --build
#
# Traefik: rota `bigworks-site-web` em /root/traefik/dynamic.yml
# URL: https://site.bigworks.com.br

networks:
  traefik_public:
    external: true

services:
  web:
    build: .
    image: bigworks-site:local
    container_name: bigworks_site_web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 320m
    networks:
      - traefik_public
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
