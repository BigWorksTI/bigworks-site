# Deploy (Stage; e daqui que site.bigworks.com.br e servido, via Traefik):
#   docker compose -p bigworks-site up -d --build
#
# Traefik: rota `bigworks-site-web` em /root/traefik/dynamic.yml
# O Traefik aponta para bigworks_site_web:3000.

networks:
  traefik:
    external: true

services:
  web:
    build: .
    image: bigworks-site:local
    container_name: bigworks_site_web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
