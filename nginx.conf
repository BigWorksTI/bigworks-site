server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # O site antigo servia /logos e /brand na raiz; o ielos e outros sites
    # ainda apontam para esses caminhos.
    rewrite ^/(logos|brand)/(.*)$ /assets/$1/$2 last;

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
